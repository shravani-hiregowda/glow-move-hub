name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jerai_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jerai_test?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@jerai/api

      - name: Run ESLint
        id: lint
        run: npm run lint

      - name: Run TypeScript typecheck
        id: typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        id: test
        run: npm run test

      - name: Build frontend and API bundles
        id: build
        run: npm run build

      - name: Post Quality Gate Summary
        if: always()
        run: |
          echo "### Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint | ${{ steps.lint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Typecheck | ${{ steps.typecheck.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit & Integration Tests | ${{ steps.test.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Build | ${{ steps.build.outcome }} |" >> $GITHUB_STEP_SUMMARY

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: jerai_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/jerai_ci_test?schema=public
      DIRECT_URL: postgresql://ci_user:ci_password@localhost:5432/jerai_ci_test?schema=public
      CORS_ORIGIN: http://localhost:5173
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: uploads
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@jerai/api

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        run: npm run prisma:migrate --workspace=@jerai/api

      - name: Seed test database
        run: npm run prisma:seed --workspace=@jerai/api

      - name: Run Playwright E2E tests
        id: e2e
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Post E2E Summary
        if: always()
        run: |
          echo "### Playwright E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Status | ${{ steps.e2e.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser Target | Chromium |" >> $GITHUB_STEP_SUMMARY
          echo "| Isolated Database | postgres:17-alpine (CI Service) |" >> $GITHUB_STEP_SUMMARY
